<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <clipPath id="avatarClip">
      <circle cx="670" cy="125" r="62"/>
    </clipPath>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="78%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#141b2d"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <filter id="neonGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1b2233" stroke-width="1"/>
    </pattern>
    <path id="textCirclePath" d="M 670,50 a 75,75 0 1,1 -0.1,0 z" fill="none"/>
    <style>
      @keyframes pulse1 {
        0%   { r: 68; opacity: 0.8; }
        50%  { r: 90; opacity: 0.1; }
        100% { r: 68; opacity: 0.8; }
      }
      @keyframes pulse2 {
        0%   { r: 78; opacity: 0.5; }
        50%  { r: 102; opacity: 0.05; }
        100% { r: 78; opacity: 0.5; }
      }
      @keyframes pulse3 {
        0%   { r: 88; opacity: 0.3; }
        50%  { r: 114; opacity: 0; }
        100% { r: 88; opacity: 0.3; }
      }
      #ring1 { animation: pulse1 3.4s ease-in-out infinite; }
      #ring2 { animation: pulse2 3.4s ease-in-out infinite 0.5s; }
      #ring3 { animation: pulse3 3.4s ease-in-out infinite 1s; }
      @keyframes floatFade {
        0%, 100% { opacity: 0.25; transform: translateY(0); }
        50%      { opacity: 0.6;  transform: translateY(-6px); }
      }
      .code-float { animation: floatFade 6s ease-in-out infinite; }
      @keyframes blinkDot {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.2; }
      }
      #statusDot { animation: blinkDot 2s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="250" fill="url(#bgGlow)"/>
  <rect width="800" height="250" fill="url(#grid)"/>

  <text class="code-float" x="28" y="36" font-family="Consolas, 'Fira Code', monospace" font-size="11" fill="#22d3ee">const engineer = "rahul-swargam";</text>
  <text class="code-float" x="28" y="214" font-family="Consolas, 'Fira Code', monospace" font-size="11" fill="#c084fc" style="animation-delay:1.4s">$ kubectl apply -f career.yaml</text>
  <text class="code-float" x="28" y="228" font-family="Consolas, 'Fira Code', monospace" font-size="11" fill="#22d3ee" style="animation-delay:2.6s">status: ONLINE // uptime: 5y+</text>

  <text x="52" y="103" font-family="Consolas, 'Fira Code', monospace" font-weight="700" font-size="33" fill="url(#titleGradient)" filter="url(#neonGlow)">RAHUL SWARGAM</text>
  <text x="52" y="132" font-family="Consolas, 'Fira Code', monospace" font-size="15" fill="#8b949e">&gt; DevOps Engineer // Cloud &amp; Automation</text>
  <text x="52" y="160" font-family="Consolas, 'Fira Code', monospace" font-size="12.5" fill="#56d4dd" letter-spacing="1">AWS // KUBERNETES // TERRAFORM // CI_CD</text>

  <circle id="ring3" cx="670" cy="125" r="88" fill="none" stroke="#c084fc" stroke-width="1.2" filter="url(#neonGlow)"/>
  <circle id="ring2" cx="670" cy="125" r="78" fill="none" stroke="#22d3ee" stroke-width="1.4" filter="url(#neonGlow)"/>
  <circle id="ring1" cx="670" cy="125" r="68" fill="none" stroke="#c084fc" stroke-width="1.6" filter="url(#neonGlow)"/>

  <text font-family="Consolas, 'Fira Code', monospace" font-size="9.5" fill="#22d3ee" letter-spacing="2">
    <textPath href="#textCirclePath" startOffset="0%">
      SYSTEM.RUN() // AI_AGENT // NEURAL_NET // SYSTEM.RUN() // AI_AGENT // NEURAL_NET //
      <animate attributeName="startOffset" from="0%" to="100%" dur="20s" repeatCount="indefinite"/>
    </textPath>
  </text>

  <circle cx="670" cy="125" r="64" fill="#0d1117" stroke="#22d3ee" stroke-width="2"/>
  <image href="data:image/jpeg;base64," x="608" y="63" width="124" height="124" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>

  <circle id="statusDot" cx="714" cy="171" r="7.5" fill="#3fb950" stroke="#0d1117" stroke-width="2.5"/>
</svg>
